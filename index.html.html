<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>陳姵羽 Pamy｜個人履歷</title>
<style id="app-css">
:root{
  --bg:#FBF8FF; --surface:#FFFFFF; --ink:#211B40; --muted:#625C7E; --line:#E8E2F6;
  --coral:#FF5A79; --sun:#FFC53D; --aqua:#0FAE9F; --violet:#6B5BFF; --sky:#2E9BEA;
  --coral-soft:#FFE3E9; --sun-soft:#FFF1CC; --aqua-soft:#D6F5F1; --violet-soft:#E7E4FF; --sky-soft:#DCEFFD;
  --on-color:#FFFFFF;
  --fun:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15112B; --surface:#201B3D; --ink:#F4F1FF; --muted:#B8B2D6; --line:#352E5E;
    --coral:#FF7891; --sun:#FFD166; --aqua:#3DD9C9; --violet:#9C90FF; --sky:#63B9F5;
    --coral-soft:#3D2034; --sun-soft:#3A3120; --aqua-soft:#173A3C; --violet-soft:#2C2858; --sky-soft:#1A3049;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112B; --surface:#201B3D; --ink:#F4F1FF; --muted:#B8B2D6; --line:#352E5E;
  --coral:#FF7891; --sun:#FFD166; --aqua:#3DD9C9; --violet:#9C90FF; --sky:#63B9F5;
  --coral-soft:#3D2034; --sun-soft:#3A3120; --aqua-soft:#173A3C; --violet-soft:#2C2858; --sky-soft:#1A3049;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.75;-webkit-text-size-adjust:100%;overflow-x:hidden}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px;border-radius:6px}
.wrap{max-width:70rem;margin:0 auto;padding:0 1.25rem}

/* progress + top bar */
.progress{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:4px;width:100%;z-index:11;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--coral),var(--sun),var(--aqua),var(--violet))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topbar .wrap{display:flex;align-items:center;gap:1.25rem;height:4rem}
.brand{font-family:var(--fun);font-weight:700;font-size:1.25rem;text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:.45rem}
.brand i{width:.7rem;height:.7rem;border-radius:50%;background:var(--coral);box-shadow:.9rem 0 0 var(--sun),1.8rem 0 0 var(--aqua);margin-right:1.9rem}
.topbar nav{display:flex;gap:.35rem;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.topbar nav::-webkit-scrollbar{display:none}
.topbar nav a{text-decoration:none;font-size:.95rem;font-weight:500;color:var(--muted);white-space:nowrap;padding:.35rem .8rem;border-radius:999px;transition:background .2s,color .2s}
.topbar nav a:hover{background:var(--violet-soft);color:var(--violet)}

/* hero */
.hero{position:relative;padding:4rem 0 4.5rem;min-height:min(78vh,44rem);display:flex;align-items:center}
.hero-text{position:relative;z-index:2;max-width:46rem}
.hi{display:inline-flex;align-items:center;gap:.4rem;background:var(--sun-soft);color:var(--ink);font-weight:700;padding:.35rem 1rem;border-radius:999px;font-size:.95rem}
.hi .wave{display:inline-block;transform-origin:70% 70%}
.name{font-family:var(--sans);font-weight:900;font-size:clamp(2.8rem,8vw,5rem);line-height:1.1;margin:1rem 0 .5rem;letter-spacing:.02em}
.name .en{font-family:var(--fun);font-weight:700;font-size:.42em;color:var(--violet);margin-left:.5rem;letter-spacing:0}
.typer{font-size:clamp(1.25rem,3.2vw,1.7rem);font-weight:700;margin:0 0 1.25rem;min-height:1.6em}
.typer .word{color:var(--coral)}
.typer .caret{display:inline-block;width:3px;height:1.1em;background:var(--coral);vertical-align:-.15em;margin-left:2px}
.motto{display:inline-block;font-family:var(--fun);font-weight:700;font-size:clamp(2rem,6vw,3.4rem);line-height:1.15;margin:0 0 1.5rem;padding:0 .2em;background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 92%,transparent 92%);transform:rotate(-2deg);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .motto{background:var(--sun);color:#211B40;padding:.05em .35em;border-radius:.3em}}
:root[data-theme="dark"] .motto{background:var(--sun);color:#211B40;padding:.05em .35em;border-radius:.3em}
.tagline{font-size:1.15rem;max-width:34em;margin:0 0 2rem;color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:0 1.5rem;border-radius:999px;font-weight:700;font-size:1rem;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--coral);color:var(--on-color);box-shadow:0 6px 0 color-mix(in srgb,var(--coral) 55%,#000)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--coral) 55%,#000)}
.btn.ghost{background:var(--surface);color:var(--violet);border-color:var(--violet)}
.avatar{position:absolute;top:1.5rem;right:.5rem;z-index:3;width:13rem;aspect-ratio:3/4;border-radius:1.4rem;padding:0;border:0;background:none;cursor:zoom-in;transform:rotate(3deg);transition:transform .3s}
.avatar:hover{transform:rotate(0) scale(1.03)}
.avatar::before{content:"";position:absolute;inset:-6px;border-radius:1.75rem;background:linear-gradient(135deg,var(--coral),var(--sun),var(--aqua),var(--violet))}
.avatar img{position:relative;width:100%;height:100%;border-radius:1.4rem;object-fit:cover;border:5px solid var(--bg)}
.avatar .bubble{position:absolute;left:-1.6rem;bottom:1.2rem;background:var(--surface);color:var(--ink);font-family:var(--fun);font-weight:700;font-size:.9rem;padding:.25rem .7rem;border-radius:999px 999px 999px .2rem;box-shadow:0 4px 14px rgba(40,20,90,.15)}
.shape{position:absolute;z-index:1;pointer-events:none}
.s1{width:13rem;height:13rem;right:8%;bottom:6%;border-radius:42% 58% 63% 37%/45% 41% 59% 55%;background:var(--aqua-soft)}
.s2{width:3.2rem;height:3.2rem;right:34%;top:12%;border-radius:50%;background:var(--sun)}
.s3{width:5.5rem;right:22%;bottom:22%;color:var(--coral)}
.s4{width:2.2rem;left:-1.2rem;top:20%;color:var(--violet)}
.s5{width:1.2rem;height:1.2rem;right:4%;top:58%;border-radius:4px;background:var(--sky);transform:rotate(20deg)}

/* sections */
section.block{padding:4.5rem 0}
.block h2{font-weight:900;font-size:clamp(1.9rem,4.5vw,2.6rem);margin:0 0 2rem;line-height:1.3;display:flex;align-items:center;gap:.7rem}
.block h2 .emoji{display:inline-grid;place-items:center;width:3rem;height:3rem;border-radius:1rem;font-size:1.5rem;transform:rotate(-6deg)}
.block h3{font-size:1.15rem;margin:0;line-height:1.5}
.lead{max-width:40em;margin:0}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:3rem;align-items:start}
.highlights{list-style:none;margin:0;padding:0;display:grid;gap:.7rem}
.highlights li{background:var(--surface);border-radius:1rem;padding:.8rem 1rem .8rem 3rem;position:relative;box-shadow:0 2px 0 var(--line)}
.highlights li::before{content:"✦";position:absolute;left:1.1rem;top:.75rem;color:var(--c,var(--coral))}
.highlights li:nth-child(4n+2){--c:var(--aqua)}.highlights li:nth-child(4n+3){--c:var(--violet)}.highlights li:nth-child(4n+4){--c:var(--sun)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem;margin-top:2.5rem}
.stats div{border-radius:1.25rem;padding:1.25rem 1.4rem;background:var(--c-soft)}
.stats div:nth-child(3n+1){--c:var(--coral);--c-soft:var(--coral-soft)}.stats div:nth-child(3n+2){--c:var(--aqua);--c-soft:var(--aqua-soft)}.stats div:nth-child(3n+3){--c:var(--violet);--c-soft:var(--violet-soft)}
.stats strong{display:block;font-family:var(--fun);font-weight:700;font-size:2.3rem;line-height:1.2;color:var(--c)}
.stats span{font-size:.92rem;color:var(--ink)}

/* results */
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.result{--c:var(--coral);--c-soft:var(--coral-soft);background:var(--surface);border-radius:1.5rem;padding:1.6rem;border:2px solid var(--line);position:relative;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.result:nth-child(5n+2){--c:var(--aqua);--c-soft:var(--aqua-soft)}
.result:nth-child(5n+3){--c:var(--violet);--c-soft:var(--violet-soft)}
.result:nth-child(5n+4){--c:var(--sky);--c-soft:var(--sky-soft)}
.result:nth-child(5n+5){--c:#E9A400;--c-soft:var(--sun-soft)}
.result::before{content:"";position:absolute;right:-2.5rem;top:-2.5rem;width:8rem;height:8rem;border-radius:50%;background:var(--c-soft);transition:transform .4s}
.result:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--c);box-shadow:0 10px 0 var(--c-soft)}
.result:hover::before{transform:scale(1.35)}
.metric{position:relative}
.metric strong{display:block;font-family:var(--fun);font-weight:700;font-size:clamp(2rem,4.5vw,2.7rem);line-height:1.15;color:var(--c)}
.metric span{font-size:.9rem;color:var(--muted)}
.result h3{position:relative;margin-top:1rem}
.result .period{display:inline-block;font-size:.82rem;font-weight:700;color:var(--c);background:var(--c-soft);border-radius:999px;padding:.05rem .7rem;margin:.4rem 0 .7rem}
.result p{margin:0 0 .5rem}
.kpis{list-style:none;margin:.9rem 0 .4rem;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:.5rem;position:relative}
.kpis li{background:var(--c-soft);border-radius:.9rem;padding:.55rem .75rem;line-height:1.35}
.kpis strong{display:block;font-family:var(--fun);font-weight:700;font-size:1.15rem;color:var(--c)}
.kpis span{font-size:.8rem;color:var(--ink)}
.outcome{font-weight:500;border-top:2px dashed var(--line);padding-top:.6rem;margin-top:.8rem!important}
.outcome::before{content:"🎯 ";}

/* skills */
.ai-panel{border-radius:1.75rem;padding:2rem;color:#fff;background:linear-gradient(135deg,#6B5BFF,#9B4DFF 55%,#FF5A79);position:relative;overflow:hidden}
.ai-panel::after{content:"AI";position:absolute;right:-.5rem;bottom:-3.2rem;font-family:var(--fun);font-weight:700;font-size:11rem;line-height:1;opacity:.12;pointer-events:none}
.ai-panel h3{font-size:1.35rem;margin-bottom:1.25rem}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.9rem 2rem;list-style:none;margin:0;padding:0;position:relative;z-index:1}
.tools li .row{display:flex;justify-content:space-between;gap:1rem;font-weight:500}
.tools li .row small{font-size:.85rem;opacity:.85}
.bar{height:8px;border-radius:999px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:.35rem;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--sun);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.in .bar i,.bar.in i{width:var(--w)}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-top:1.25rem}
.card{background:var(--surface);border-radius:1.5rem;padding:1.6rem;border:2px solid var(--line)}
.card h3{margin-bottom:1rem}
.card .bar i{background:var(--aqua)}
.lang{list-style:none;margin:0;padding:0}
.lang li{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:2px dotted var(--line)}
.lang li:last-child{border-bottom:0}
.lang span{color:var(--muted);text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem;padding:0;list-style:none}
.tags li{padding:.4rem 1rem;border-radius:999px;font-weight:500;font-size:.95rem;background:var(--c-soft);color:var(--ink);border:2px solid var(--c);cursor:default;transition:transform .2s}
.tags li:nth-child(5n+1){--c:var(--coral);--c-soft:var(--coral-soft)}.tags li:nth-child(5n+2){--c:var(--aqua);--c-soft:var(--aqua-soft)}.tags li:nth-child(5n+3){--c:var(--violet);--c-soft:var(--violet-soft)}.tags li:nth-child(5n+4){--c:var(--sun);--c-soft:var(--sun-soft)}.tags li:nth-child(5n+5){--c:var(--sky);--c-soft:var(--sky-soft)}
.tags li:hover{transform:translateY(-3px) rotate(-3deg)}

/* certs */
.certs{display:grid;grid-template-columns:1.2fr 1fr;gap:3rem;align-items:start}
.cert-list{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.cert-list li{background:var(--surface);border-radius:1.1rem;padding:1rem 1.2rem 1rem 3.6rem;position:relative;border:2px solid var(--line)}
.cert-list li::before{content:"🏅";position:absolute;left:1.1rem;top:.95rem;font-size:1.4rem}
.cert-list .meta{font-size:.9rem;color:var(--muted)}
.badge{display:inline-block;margin-left:.5rem;padding:.05rem .7rem;border-radius:999px;background:var(--coral);color:#fff;font-size:.78rem;font-weight:700;vertical-align:.12em}
.edu{margin-top:1.5rem;background:var(--sky-soft);border-radius:1.1rem;padding:1rem 1.2rem}
.edu .meta{color:var(--muted);font-size:.9rem}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;padding:1rem .5rem}
.gallery figure{margin:0;background:var(--surface);padding:.6rem .6rem .9rem;border-radius:.6rem;box-shadow:0 10px 24px rgba(40,20,90,.14);transform:rotate(-3deg);transition:transform .3s}
.gallery figure:nth-child(2){transform:rotate(3deg) translateY(1.5rem)}
.gallery figure:hover{transform:rotate(0) scale(1.04)}
.gallery img{width:100%;border-radius:.35rem;aspect-ratio:3/4;object-fit:cover}
.gallery figcaption{font-size:.82rem;color:var(--muted);margin-top:.6rem;line-height:1.5;text-align:center}
.gallery figcaption b{display:block;color:var(--ink);font-size:.95rem}

/* contact */
.contact{border-radius:2rem;padding:3.5rem 1.5rem;margin:3rem 0;text-align:center;color:#fff;background:linear-gradient(135deg,#FF5A79,#FF8A5B 50%,#FFC53D);position:relative;overflow:hidden}
.contact::before,.contact::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}
.contact::before{width:14rem;height:14rem;left:-4rem;top:-5rem}
.contact::after{width:9rem;height:9rem;right:-2rem;bottom:-3rem}
.contact h2{font-weight:900;font-size:clamp(2rem,5vw,2.8rem);margin:0 0 .5rem;position:relative}
.contact p{margin:0 auto 1.75rem;max-width:32em;position:relative}
.mailbox{position:relative;display:inline-flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.6rem;background:#fff;color:#211B40;border-radius:999px;padding:.4rem .4rem .4rem 1.3rem;max-width:100%}
.mailbox a{font-family:var(--fun);font-weight:700;font-size:clamp(1rem,3.4vw,1.35rem);text-decoration:none;word-break:break-all}
.mailbox button{border:0;border-radius:999px;background:#211B40;color:#fff;font-weight:700;padding:.55rem 1.1rem;cursor:pointer;min-height:2.6rem}
.contact-more{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:1.5rem}
.contact-more a,.contact-more span{background:rgba(255,255,255,.22);padding:.35rem 1rem;border-radius:999px;text-decoration:none;color:#fff;font-weight:500}
footer{text-align:center;font-size:.85rem;color:var(--muted);padding:0 0 3rem}

/* gate */
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 1.5rem) 1.25rem calc(env(safe-area-inset-bottom,0px) + 1.5rem);background:var(--bg);overflow:hidden;transition:opacity .6s,transform .6s}
.gate.out{opacity:0;transform:scale(1.06);pointer-events:none}
.gate .blob{position:absolute;border-radius:50%;filter:blur(2px)}
.gate .b1{width:26rem;height:26rem;left:-8rem;top:-8rem;background:var(--coral-soft)}
.gate .b2{width:20rem;height:20rem;right:-6rem;bottom:-6rem;background:var(--aqua-soft)}
.gate .b3{width:8rem;height:8rem;right:12%;top:14%;background:var(--sun-soft)}
.gate-card{position:relative;text-align:center;max-width:34rem}
.gate-card img{width:7.5rem;height:7.5rem;border-radius:50%;object-fit:cover;object-position:50% 20%;margin:0 auto 1.25rem;border:5px solid var(--surface);box-shadow:0 0 0 5px var(--coral)}
.gate-card .greet{font-family:var(--fun);font-weight:700;font-size:1.3rem;color:var(--coral);margin:0}
.gate-card h1{text-wrap:balance;font-size:clamp(1.6rem,5vw,2.3rem);font-weight:900;line-height:1.35;margin:.5rem 0 2rem}
.gate-btns{display:flex;justify-content:center;align-items:center;gap:1rem;flex-wrap:wrap;min-height:4.5rem}
.gate .yes{font-size:1.15rem;min-height:3.4rem;padding:0 2rem;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.gate .no{font-size:1rem;min-height:3rem;padding:0 1.4rem;background:var(--surface);color:var(--muted);border:2px solid var(--line);white-space:nowrap}
.gate .no.flying{position:fixed;z-index:51;transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1),background .2s;background:var(--sun-soft);color:var(--ink);border-color:var(--sun)}
.gate .hint{margin-top:1.25rem;font-size:.9rem;color:var(--muted);min-height:1.5em}
.confetti{position:fixed;z-index:60;width:10px;height:14px;border-radius:2px;pointer-events:none}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:45;background:rgba(20,15,40,.75);display:grid;place-items:center;padding:1.5rem;cursor:zoom-out}
.lightbox img{max-height:85vh;width:auto;border-radius:1.25rem;border:6px solid #fff}

/* motion */
.reveal{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
  .reveal.in{opacity:1;transform:none}
  .hi .wave{animation:wave 2.2s ease-in-out infinite}
  @keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
  .typer .caret{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .shape{animation:float 7s ease-in-out infinite}
  .s2{animation-duration:5s}.s3{animation-duration:8s;animation-delay:-2s}.s4{animation-duration:6s;animation-delay:-1s}.s5{animation-duration:4.5s}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -16px}}
  .gate-card{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .gate .yes.wiggle{animation:wiggle .5s}
  @keyframes wiggle{25%{rotate:-6deg}50%{rotate:5deg}75%{rotate:-3deg}}
  .contact .wave{display:inline-block;animation:wave 2.2s ease-in-out infinite;transform-origin:70% 70%}
}

@media (max-width:820px){
  .hero{padding:2.5rem 0 3.5rem;min-height:0}
  .hero{display:block}
  .avatar{position:relative;top:auto;right:auto;float:right;width:8.5rem;margin:.3rem .3rem 1rem 1rem}
  .avatar .bubble{font-size:.75rem;left:-1rem;bottom:.6rem}
  .name{margin-top:1rem}
  .cta{clear:both}
  .typer .word::before{content:"\A";white-space:pre}
  .about,.certs,.skill-grid{grid-template-columns:1fr;gap:2rem}
  .results{grid-template-columns:1fr}
  .ai-panel,.card,.result{padding:1.4rem}
  .s1,.s3,.s5{display:none}

.edit-fab{position:fixed;right:1.25rem;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(100%,30rem);z-index:30;background:var(--surface);color:var(--ink);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:1.1rem;margin:0}
.drawer-head p{margin:0;font-size:.8rem;color:var(--muted)}
.drawer-body{flex:1;overflow-y:auto;padding:.5rem 1.25rem 1.5rem}
.drawer-foot{display:flex;gap:.75rem;padding:1rem 1.25rem;border-top:1px solid var(--line);align-items:center}
.drawer-foot .status{flex:1;font-size:.85rem;color:var(--muted)}
.drawer-foot .btn{min-height:2.7rem;padding:0 1.1rem;box-shadow:none}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{cursor:pointer;padding:.9rem 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::after{content:"＋";color:var(--muted)}
.drawer details[open] summary::after{content:"－"}
.field{display:block;margin:0 0 .9rem}
.field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
.field input,.field textarea,.field select{box-sizing:border-box;width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.5rem;padding:.55rem .7rem}
.field textarea{min-height:6rem;resize:vertical;line-height:1.6}
.item{border:1px solid var(--line);border-radius:.75rem;padding:.9rem;margin:0 0 .9rem;background:var(--bg)}
.item .field input,.item .field textarea,.item .field select{background:var(--surface)}
.item-tools{display:flex;gap:.4rem;justify-content:flex-end;margin-bottom:.5rem}
.mini{font-size:.85rem;padding:.3rem .7rem;border-radius:.5rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:2.2rem}
.mini.danger{color:#D23A4F}
.add{width:100%;margin-bottom:1rem}
.img-field{display:flex;gap:.9rem;align-items:center;margin-bottom:1rem}
.img-field img{width:4.5rem;height:4.5rem;object-fit:cover;border-radius:.5rem}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:.75rem;font-size:.95rem;max-width:calc(100% - 2rem);text-align:center}
.restore{position:fixed;left:1rem;right:1rem;top:calc(env(safe-area-inset-top,0px) + 4.5rem);z-index:25;max-width:34rem;margin:0 auto;background:var(--surface);border:2px solid var(--sun);border-radius:.9rem;padding:1rem;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.restore p{margin:0;flex:1 1 14rem;font-size:.95rem}
@media print{.topbar,.edit-fab,.drawer,.gate,.progress,.shape{display:none}.reveal{opacity:1;transform:none}}

      if(tries>=pleas.length)return;

      no.textContent=pleas[tries];tries++;

      var w=no.offsetWidth,h=no.offsetHeight,yr=el.querySelector('.gate-card').getBoundingClientRect(),pad=16,x,y,i=0;
      do{x=pad+Math.random()*Math.max(1,innerWidth-w-pad*2);y=pad+Math.random()*Math.max(1,innerHeight-h-pad*2);i++;}
      while(i<60&&(overlap({left:x-20,top:y-20,right:x+w+20,bottom:y+h+20},yr)||Math.abs(x-r0.left)+Math.abs(y-r0.top)<160));

  function confetti(r){

  }
  render();renderEditor();typerTick();
  var seen=false;try{seen=sessionStorage.getItem(GATE_KEY)==='1';sessionStorage.removeItem(GATE_KEY);}catch(e){}
  if(!seen)showGate();
  if(window.claude)initCaps();else window.addEventListener('load',initCaps);
})();
</script>
